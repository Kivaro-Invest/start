<title>Lumi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap">
<style>
  /* Layout: a phone-width app shell; dawn (morning) and dusk (evening) are the two accents, gold marks what came true */
  :root {
    --bg: #f5f2fa;
    --surface: #ffffff;
    --surface-2: #ece7f6;
    --ink: #231d36;
    --muted: #6d6585;
    --line: #ddd6ea;
    --dawn: #f0864f;
    --dawn-soft: #fde6d8;
    --dusk: #5546c9;
    --dusk-soft: #e3e0fa;
    --gold: #b8860b;
    --gold-soft: #f8edcc;
    --on-accent: #ffffff;
    --display: "Instrument Serif", Georgia, "Times New Roman", serif;
    --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --r: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13101e; --surface: #1d182c; --surface-2: #272038; --ink: #f1edfa; --muted: #a79fbf; --line: #332b47;
      --dawn: #ff9f6b; --dawn-soft: #3a2420; --dusk: #9182ff; --dusk-soft: #28224a; --gold: #f0c75e; --gold-soft: #3a3020;
      --on-accent: #13101e; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13101e; --surface: #1d182c; --surface-2: #272038; --ink: #f1edfa; --muted: #a79fbf; --line: #332b47;
    --dawn: #ff9f6b; --dawn-soft: #3a2420; --dusk: #9182ff; --dusk-soft: #28224a; --gold: #f0c75e; --gold-soft: #3a3020;
    --on-accent: #13101e; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--dusk); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.1; margin: 0; text-wrap: balance; }
  h1 { font-size: 2.6rem; }
  h2 { font-size: 1.9rem; }
  h3 { font-size: 1.35rem; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 0.85rem; }
  .label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }

  .app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
  main { flex: 1; padding: 20px 16px 110px; display: flex; flex-direction: column; gap: 16px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }

  .card { background: var(--surface); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .card.dawn { background: var(--dawn-soft); }
  .card.dusk { background: var(--dusk-soft); }
  .card.gold { background: var(--gold-soft); }

  .btn { border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 700; background: var(--ink); color: var(--bg); }
  .btn.dawn { background: var(--dawn); color: var(--on-accent); }
  .btn.dusk { background: var(--dusk); color: var(--on-accent); }
  .btn.gold { background: var(--gold); color: var(--on-accent); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .btn.wide { width: 100%; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 0.9rem; }

  .chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 0.9rem; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tag { font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }

  input[type="text"], input[type="time"] { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 13px 14px; }
  input:focus { border-color: var(--dusk); outline: none; }

  /* Streak */
  .streak { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  .flame { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: var(--dawn); color: var(--on-accent); }
  .flame b { font-family: var(--display); font-size: 2.3rem; font-weight: 400; line-height: 1; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
  .week span { font-size: 0.7rem; color: var(--muted); font-weight: 600; }
  .week i { display: block; margin: 4px auto 0; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); }
  .week i.done { background: var(--dawn); }
  .week i.pause { background: var(--dusk-soft); border: 2px dashed var(--dusk); }
  .week i.today { box-shadow: 0 0 0 2px var(--ink); }

  .entry-done { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .check { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--bg); font-size: 0.9rem; flex: none; }
  .quote { font-family: var(--display); font-style: italic; font-size: 1.25rem; line-height: 1.3; }

  /* Nav */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
  nav.tabs div { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
  nav.tabs button { background: none; border: 0; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.72rem; font-weight: 600; color: var(--muted); }
  nav.tabs button svg { width: 24px; height: 24px; }
  nav.tabs button[aria-current="page"] { color: var(--ink); }

  /* Overlay */
  .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 10; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .overlay .inner { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
  .close { align-self: flex-end; background: var(--surface); border: 0; border-radius: 999px; width: 40px; height: 40px; font-size: 1.2rem; }

  .rec-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; padding-block: 20px; }
  .rec { width: 148px; height: 148px; border-radius: 50%; border: 0; display: grid; place-items: center; color: var(--on-accent); position: relative; }
  .rec.dawn { background: var(--dawn); } .rec.dusk { background: var(--dusk); } .rec.ink { background: var(--ink); color: var(--bg); }
  .rec svg { width: 52px; height: 52px; }
  .rec.live::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 3px solid currentColor; opacity: 0.4; transform: scale(var(--lvl, 1)); transition: transform 0.08s; }
  .rec.dawn.live::after { border-color: var(--dawn); } .rec.dusk.live::after { border-color: var(--dusk); } .rec.ink.live::after { border-color: var(--ink); }
  .timer { font-family: var(--display); font-size: 3rem; font-variant-numeric: tabular-nums; }

  /* Onboarding */
  .ob { min-height: 100%; display: flex; flex-direction: column; gap: 20px; padding: 28px 16px calc(24px + env(safe-area-inset-bottom, 0px)); max-width: 480px; margin: 0 auto; }
  .ob .grow { flex: 1; display: flex; flex-direction: column; gap: 18px; }
  .dots { display: flex; gap: 6px; }
  .dots i { height: 4px; flex: 1; border-radius: 4px; background: var(--line); }
  .dots i.on { background: var(--ink); }
  .hero-orb { width: 180px; height: 180px; border-radius: 50%; margin: 10px auto; background: radial-gradient(circle at 35% 30%, var(--dawn) 0%, transparent 60%), radial-gradient(circle at 70% 75%, var(--dusk) 0%, transparent 60%), var(--surface-2); }

  /* Wishes */
  .wish { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .wish p { font-weight: 600; }
  .fulfilled { border: 1.5px solid var(--gold); }

  /* Board */
  .preview { width: 100%; border-radius: 16px; display: block; background: var(--surface-2); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 999px; padding: 4px; }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 9px; font-weight: 700; font-size: 0.88rem; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }

  /* Sounds */
  .sound { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; background: var(--surface); border-radius: var(--r); padding: 14px; border: 1.5px solid transparent; text-align: left; width: 100%; }
  .sound[aria-pressed="true"] { border-color: var(--ink); }
  .sound .play { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--on-accent); }
  .sound .play svg { width: 22px; height: 22px; }

  /* Shop */
  .shop { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .product { background: var(--surface); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .product .art { aspect-ratio: 1; border-radius: 14px; max-width: 100%; display: grid; place-items: center; }
  .product .art span { font-family: var(--display); font-size: 1.15rem; text-align: center; padding: 8px; line-height: 1.15; }
  .product .price { font-weight: 700; }
  .product .btn { padding: 9px 12px; font-size: 0.85rem; }
  .gem { width: 58%; aspect-ratio: 1; border-radius: 42% 58% 50% 50% / 55% 45% 55% 45%; }

  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
  @media (prefers-reduced-motion: reduce) { .rec.live::after { transition: none; } }
</style>

<div id="root"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- Daten ---------- */
const KEY = 'lumi-proto-v1';
const AREAS = {
  geld: { name: 'Geld & Fülle', ex: 'Ich verdiene mühelos genug, um frei zu leben.' },
  liebe: { name: 'Liebe', ex: 'Ich bin in einer liebevollen, ehrlichen Beziehung.' },
  gesundheit: { name: 'Gesundheit', ex: 'Ich fühle mich jeden Tag fit und voller Energie.' },
  karriere: { name: 'Karriere', ex: 'Ich arbeite in einem Job, der mich erfüllt.' },
  selbst: { name: 'Selbstliebe', ex: 'Ich mag mich so, wie ich bin.' },
  zuhause: { name: 'Zuhause', ex: 'Ich wohne in einer hellen Wohnung, die ich liebe.' },
  reisen: { name: 'Reisen', ex: 'Ich sehe dieses Jahr das Meer in Portugal.' },
  menschen: { name: 'Freunde & Familie', ex: 'Ich bin umgeben von Menschen, die mir guttun.' },
};
const MORNING_PROMPTS = [
  'Sprich deine Absicht für heute aus, als wäre sie schon wahr.',
  'Wie fühlt sich dein Leben an, wenn dein größter Wunsch erfüllt ist?',
  'Was darf heute leicht zu dir kommen?',
  'Wer bist du heute, wenn du schon alles hast, was du dir wünschst?',
];
const EVENING_PROMPTS = [
  'Wofür bist du heute dankbar? Nenne drei Dinge.',
  'Welcher Moment heute war schöner als erwartet?',
  'Wem bist du heute dankbar und warum?',
];
const dayKey = d => { const x = new Date(d); x.setHours(12, 0, 0, 0); return x.toISOString().slice(0, 10); };
const today = () => dayKey(new Date());
const addDays = (k, n) => { const d = new Date(k + 'T12:00:00'); d.setDate(d.getDate() + n); return dayKey(d); };
const uid = () => Math.random().toString(36).slice(2, 9);
const fmtDate = k => new Date(k + 'T12:00:00').toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' });
const fmtDur = s => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let S = load();
const audioUrls = {}; // nur für diese Sitzung: Aufnahmen werden im Prototyp nicht dauerhaft gespeichert

function blank() {
  return { onboarded: false, name: '', areas: [], goals: [], morning: '07:30', evening: '21:30', entries: [], pauses: [], pausesLeft: 2 };
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.entries) return s; } catch (e) {} return blank(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function demo() {
  const t = today();
  const s = blank();
  Object.assign(s, { onboarded: true, name: 'Mia', areas: ['geld', 'liebe', 'reisen'], pausesLeft: 1 });
  s.goals = [
    { id: uid(), area: 'geld', text: 'Ich verdiene 4.000 € netto im Monat.', created: addDays(t, -60), fulfilled: null },
    { id: uid(), area: 'reisen', text: 'Ich sehe dieses Jahr das Meer in Portugal.', created: addDays(t, -60), fulfilled: null },
    { id: uid(), area: 'liebe', text: 'Ich ziehe Menschen an, die mir guttun.', created: addDays(t, -60), fulfilled: null },
    { id: uid(), area: 'karriere', text: 'Ich bekomme die Stelle als Teamleiterin.', created: addDays(t, -95), fulfilled: addDays(t, -9) },
  ];
  for (let i = 12; i >= 1; i--) {
    if (i === 5) { s.pauses.push(addDays(t, -i)); continue; }
    s.entries.push({ id: uid(), date: addDays(t, -i), kind: 'morning', dur: 40 + (i * 7) % 50 });
    if (i % 3) s.entries.push({ id: uid(), date: addDays(t, -i), kind: 'evening', dur: 55 + (i * 11) % 60 });
  }
  return s;
}

/* ---------- Streak ---------- */
function dayDone(k) { return S.entries.some(e => e.date === k) ; }
function streak() {
  let k = today(), n = 0;
  if (!dayDone(k)) k = addDays(k, -1);
  while (dayDone(k) || S.pauses.includes(k)) { if (dayDone(k)) n++; k = addDays(k, -1); }
  return n;
}
function missedYesterday() {
  const y = addDays(today(), -1);
  return !dayDone(y) && !S.pauses.includes(y) && dayDone(addDays(y, -1));
}

/* ---------- Rendering ---------- */
let tab = 'heute', obStep = 0, obDraft = null, boardFmt = 'phone', boardStyle = 'dawn';
const root = document.getElementById('root');

const ICON = {
  heute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  wuensche: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>',
  board: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/></svg>',
  klaenge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>',
  shop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
};

function render() {
  if (!S.onboarded) return renderOnboarding();
  const views = { heute: viewToday, wuensche: viewWishes, board: viewBoard, klaenge: viewSounds, shop: viewShop };
  root.innerHTML = `<div class="app"><main id="main">${views[tab]()}</main>
    <nav class="tabs" aria-label="Bereiche"><div>
      ${[['heute', 'Heute'], ['wuensche', 'Wünsche'], ['board', 'Board'], ['klaenge', 'Klänge'], ['shop', 'Shop']].map(([k, l]) =>
        `<button data-tab="${k}" ${tab === k ? 'aria-current="page"' : ''}>${ICON[k]}${l}</button>`).join('')}
    </div></nav></div>`;
  if (tab === 'board') drawBoardPreview();
}

/* Heute */
function viewToday() {
  const h = new Date().getHours();
  const hello = h < 11 ? 'Guten Morgen' : h < 18 ? 'Hallo' : 'Guten Abend';
  const t = today();
  const m = S.entries.find(e => e.date === t && e.kind === 'morning');
  const ev = S.entries.find(e => e.date === t && e.kind === 'evening');
  const q = S.entries.filter(e => e.date === t && e.kind === 'quick');
  const n = streak();
  const dayIdx = (new Date().getDay() + 6) % 7;
  const week = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map((d, i) => {
    const k = addDays(t, i - dayIdx);
    const cls = dayDone(k) ? 'done' : S.pauses.includes(k) ? 'pause' : '';
    return `<div><span>${d}</span><i class="${cls} ${k === t ? 'today' : ''}"></i></div>`;
  }).join('');
  const goal = S.goals.find(g => !g.fulfilled);
  const mp = MORNING_PROMPTS[new Date().getDate() % MORNING_PROMPTS.length];
  const ep = EVENING_PROMPTS[new Date().getDate() % EVENING_PROMPTS.length];
  const nextRem = h < parseInt(S.morning) ? S.morning : h < parseInt(S.evening) ? S.evening : S.morning + ' (morgen)';

  return `
    <div class="row between"><div><p class="label">${new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
      <h1>${hello}${S.name ? ', ' + esc(S.name) : ''}</h1></div></div>

    <section class="card">
      <div class="streak">
        <div class="flame"><b>${n}</b></div>
        <div class="stack" style="gap:4px"><h3>${n === 1 ? '1 Tag' : n + ' Tage'} in Folge</h3>
          <p class="muted small">${S.pausesLeft} Pausen-Tag${S.pausesLeft === 1 ? '' : 'e'} übrig, die deine Serie schützen</p></div>
      </div>
      <div class="week">${week}</div>
      ${missedYesterday() && S.pausesLeft > 0 ? `<button class="btn ghost" data-act="pause">Gestern als Pausen-Tag nehmen</button>` : ''}
      <div class="row"><button class="btn ghost" data-act="share-streak">Serie teilen</button></div>
    </section>

    <section class="card dawn">
      <p class="label">Morgens · Manifestieren</p>
      ${m ? `<div class="entry-done"><span class="check">✓</span>Erledigt · ${fmtDur(m.dur)} aufgenommen</div>${playBtn(m)}`
          : `<p class="quote">${esc(mp)}</p>${goal ? `<p class="small muted">Dein Wunsch: „${esc(goal.text)}“</p>` : ''}
             <button class="btn dawn wide" data-act="rec" data-kind="morning">Aufnahme starten</button>`}
    </section>

    <section class="card dusk">
      <p class="label">Abends · Dankbarkeit & Zeichen</p>
      ${ev ? `<div class="entry-done"><span class="check">✓</span>Erledigt · ${fmtDur(ev.dur)} aufgenommen</div>${playBtn(ev)}`
           : `<p class="quote">${esc(ep)}</p>
              ${goal ? `<p class="small">Und: Wo hast du heute ein Zeichen gesehen, dass „${esc(goal.text)}“ schon unterwegs ist?</p>` : ''}
              <button class="btn dusk wide" data-act="rec" data-kind="evening">Aufnahme starten</button>`}
    </section>

    <section class="card">
      <div class="row between"><div><h3>Wenig Zeit?</h3><p class="muted small">10 Sekunden reichen, und der Tag zählt für deine Serie.</p></div></div>
      <button class="btn ghost wide" data-act="rec" data-kind="quick">10-Sekunden-Eintrag</button>
      ${q.length ? `<p class="small muted">${q.length} Kurz-Eintrag${q.length > 1 ? 'e' : ''} heute</p>` : ''}
    </section>

    <section class="card">
      <p class="label">Erinnerungen</p>
      <div class="row between"><span>Morgens <b>${S.morning}</b> · Abends <b>${S.evening}</b></span></div>
      <p class="small muted">Nächste Erinnerung: ${nextRem}. In der fertigen App kommt hier eine echte Benachrichtigung aufs Handy. Wird sie ignoriert, folgt eine Stunde später eine sanfte zweite.</p>
      <button class="link" data-act="reset">Prototyp zurücksetzen</button>
    </section>`;
}
function playBtn(e) { return audioUrls[e.id] ? `<audio controls src="${audioUrls[e.id]}" style="width:100%"></audio>` : ''; }

/* Wünsche */
function viewWishes() {
  const open = S.goals.filter(g => !g.fulfilled), done = S.goals.filter(g => g.fulfilled);
  return `
    <div><p class="label">Deine Manifestationen</p><h1>Wünsche</h1></div>
    <div class="stack">

const SOUNDS = [
  { id: 'alpha', name: 'Alpha · Fokus & Lernen', desc: '10-Hz-Alphawellen mit sanftem Rauschen', beat: 10, base: 200, color: 'var(--dusk)' },
  { id: 'theta', name: 'Theta · Reflektieren', desc: '6-Hz-Thetawellen für Tagebuch und Ruhe', beat: 6, base: 180, color: 'var(--dusk)' },
  { id: 'grat', name: 'Dankbarkeit · 528 Hz', desc: 'Warmer Klangteppich für deinen Abend', beat: 0, base: 528, color: 'var(--dawn)' },
  { id: 'delta', name: 'Delta · Einschlafen', desc: '2-Hz-Deltawellen, sehr tief und ruhig', beat: 2, base: 140, color: 'var(--gold)' },
];
let playing = null, actx = null, nodes = [];
function viewSounds() {
  return `
    <div><p class="label">Mit Kopfhörern hören</p><h1>Klänge</h1></div>
    <div class="stack">
      ${SOUNDS.map(s => `<button class="sound" data-sound="${s.id}" aria-pressed="${playing === s.id}">
        <span class="play" style="background:${s.color}">${playing === s.id ? ICON.pause : ICON.play}</span>
        <span class="stack" style="gap:2px"><b>${s.name}</b><span class="small muted">${s.desc}</span></span></button>`).join('')}
    </div>
    <p class="small muted">Die Klänge werden live im Handy erzeugt: Links und rechts laufen leicht verschiedene Töne, das Gehirn hört den Unterschied als Schwebung. Zum Entspannen und Konzentrieren gedacht, nicht als medizinische Behandlung.</p>`;
}
function stopSound() {
  nodes.forEach(n => { try { n.stop && n.stop(); n.disconnect(); } catch (e) {} });
  nodes = []; playing = null;
}
function playSound(id) {
  const s = SOUNDS.find(x => x.id === id);
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  actx.resume();
  const master = actx.createGain(); master.gain.setValueAtTime(0, actx.currentTime);
  master.gain.linearRampToValueAtTime(0.35, actx.currentTime + 2); master.connect(actx.destination);
  const merger = actx.createChannelMerger(2); merger.connect(master);
  const tone = (f, ch, g) => { const o = actx.createOscillator(); o.frequency.value = f; const gn = actx.createGain(); gn.gain.value = g; o.connect(gn); gn.connect(merger, 0, ch); o.start(); nodes.push(o, gn); };
  if (s.beat) { tone(s.base, 0, 0.5); tone(s.base + s.beat, 1, 0.5); }
  else { [1, 1.5, 2].forEach((m, i) => { tone(s.base / 2 * m, 0, 0.18 / (i + 1)); tone(s.base / 2 * m + 0.7, 1, 0.18 / (i + 1)); }); }
  // weiches Rauschen
  const len = actx.sampleRate * 2, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  let last = 0; for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
  const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
  const ng = actx.createGain(); ng.gain.value = 0.25; src.connect(ng); ng.connect(master); src.start();
  nodes.push(src, ng, merger, master);
  playing = id;
}

/* ---------- Aufnahme ---------- */
async function openRecorder(kind) {
  const color = kind === 'morning' ? 'dawn' : kind === 'evening' ? 'dusk' : 'ink';
  const title = kind === 'morning' ? 'Morgen-Manifestation' : kind === 'evening' ? 'Abend-Dankbarkeit' : '10-Sekunden-Eintrag';
  const goal = S.goals.find(g => !g.fulfilled);
  const prompt = kind === 'morning' ? MORNING_PROMPTS[new Date().getDate() % MORNING_PROMPTS.length]
    : kind === 'evening' ? EVENING_PROMPTS[new Date().getDate() % EVENING_PROMPTS.length] : 'Ein Satz genügt: Wofür bist du gerade dankbar?';
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="inner"><button class="close" aria-label="Schließen">✕</button>
    <div><p class="label">${title}</p><p class="quote">${esc(prompt)}</p>${goal && kind !== 'quick' ? `<p class="small muted" style="margin-top:8px">„${esc(goal.text)}“</p>` : ''}</div>
    <div class="rec-wrap"><div class="timer" id="tmr">0:00</div>
      <button class="rec ${color}" id="recBtn" aria-label="Aufnahme starten">${ICON.mic}</button>
      <p class="muted small" id="recHint">Tippen und einfach losreden.</p></div></div>`;
  document.body.appendChild(ov);
  const btn = ov.querySelector('#recBtn'), tmr = ov.querySelector('#tmr'), hint = ov.querySelector('#recHint');
  let rec = null, stream = null, chunks = [], t0 = 0, raf = 0, an = null, simulated = false, running = false;
  const limit = kind === 'quick' ? 10 : 300;

  const close = () => { cancelAnimationFrame(raf); stream && stream.getTracks().forEach(t => t.stop()); ov.remove(); };
  ov.querySelector('.close').onclick = close;

  const tick = () => {
    const s = (performance.now() - t0) / 1000;
    tmr.textContent = fmtDur(Math.min(s, limit));
    let lvl = 1 + 0.12 * Math.sin(s * 5);
    if (an) { const a = new Uint8Array(an.fftSize); an.getByteTimeDomainData(a); let m = 0; for (const v of a) m = Math.max(m, Math.abs(v - 128)); lvl = 1 + m / 90; }
    btn.style.setProperty('--lvl', lvl.toFixed(2));
    if (s >= limit) return finish();
    raf = requestAnimationFrame(tick);
  };
  const finish = () => {
    if (!running) return; running = false;
    cancelAnimationFrame(raf);
    const dur = Math.max(1, (performance.now() - t0) / 1000);
    const entry = { id: uid(), date: today(), kind, dur: Math.round(Math.min(dur, limit)) };
    const done = () => {
      S.entries.push(entry); save(); close(); render();
      const n = streak();
      toast(`${kind === 'quick' ? 'Gespeichert' : 'Wunderbar'}. ${n} ${n === 1 ? 'Tag' : 'Tage'} in Folge.`);
    };
    if (rec && !simulated) { rec.onstop = () => { audioUrls[entry.id] = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType })); done(); }; rec.stop(); }
    else done();
  };
  btn.onclick = async () => {
    if (running) return finish();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      rec = new MediaRecorder(stream); rec.ondataavailable = e => chunks.push(e.data); rec.start();
      const ac = new (window.AudioContext || window.webkitAudioContext)(); an = ac.createAnalyser(); an.fftSize = 512;
      ac.createMediaStreamSource(stream).connect(an);
      hint.textContent = 'Läuft. Tippen zum Beenden.';
    } catch (e) {
      simulated = true;
      hint.textContent = 'Das Mikrofon ist in dieser Vorschau gesperrt, die Aufnahme wird nur simuliert. In der App wird hier wirklich aufgenommen. Tippen zum Beenden.';
    }
    running = true; t0 = performance.now();
    btn.classList.add('live'); btn.innerHTML = ICON.stop; btn.setAttribute('aria-label', 'Aufnahme beenden');
    tick();
  };
}

/* ---------- Bilder: Vision Board & Teilen ---------- */
const PAL = {
  dawn: { bg: ['#fde3cf', '#f6b38f', '#c97b8e'], ink: '#2a1b2e', soft: 'rgba(255,255,255,0.55)', accent: '#ffffff' },
  dusk: { bg: ['#1b1638', '#3b2f7a', '#7a5cc4'], ink: '#f6f1ff', soft: 'rgba(255,255,255,0.10)', accent: '#ffc9a3' },
  gold: { bg: ['#1f1a12', '#4a3a1c', '#b8902f'], ink: '#fff6df', soft: 'rgba(255,240,200,0.10)', accent: '#f0c75e' },
};
function wrap(ctx, text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines;
}
function bgPaint(ctx, w, h, p) {
  const g = ctx.createLinearGradient(0, 0, w * 0.4, h);
  g.addColorStop(0, p.bg[0]); g.addColorStop(0.6, p.bg[1]); g.addColorStop(1, p.bg[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  const r = w * 0.42, cx = w * 0.72, cy = h * 0.2;
  const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  rg.addColorStop(0, p.soft.replace(/[\d.]+\)$/, '0.9)')); rg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
}
function drawBoard(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'), p = PAL[boardStyle], u = w / 100;
  bgPaint(ctx, w, h, p);
  const year = new Date().getFullYear() + 1;
  ctx.fillStyle = p.ink; ctx.textBaseline = 'alphabetic';
  ctx.font = `600 ${u * 3}px Manrope, sans-serif`; ctx.letterSpacing = `${u * 0.6}px`;
  ctx.fillText((S.name ? S.name.toUpperCase() + ' · ' : '') + 'VISION ' + year, u * 8, h * 0.1);
  ctx.letterSpacing = '0px';
  ctx.font = `italic ${u * 13}px "Instrument Serif", Georgia, serif`;
  ctx.fillText('Es ist', u * 8, h * 0.1 + u * 15); ctx.fillText('schon da.', u * 8, h * 0.1 + u * 28);
  const goals = S.goals.filter(g => !g.fulfilled).slice(0, 5);
  const top = h * 0.1 + u * 40, avail = h * 0.9 - top, cardH = Math.min(avail / Math.max(goals.length, 1) - u * 3, u * 34);
  goals.forEach((g, i) => {
    const y = top + i * (cardH + u * 3);
    ctx.fillStyle = p.soft; roundRect(ctx, u * 8, y, w - u * 16, cardH, u * 4); ctx.fill();
    ctx.fillStyle = p.ink; ctx.globalAlpha = 0.7;
    ctx.font = `700 ${u * 2.6}px Manrope, sans-serif`; ctx.letterSpacing = `${u * 0.4}px`;
    ctx.fillText((AREAS[g.area]?.name || 'Wunsch').toUpperCase(), u * 13, y + u * 7); ctx.letterSpacing = '0px'; ctx.globalAlpha = 1;
    ctx.font = `${u * 6.2}px "Instrument Serif", Georgia, serif`;
    const lines = wrap(ctx, g.text, w - u * 26).slice(0, Math.max(1, Math.floor((cardH - u * 10) / (u * 7))));
    lines.forEach((l, j) => ctx.fillText(l, u * 13, y + u * 15 + j * u * 7));
  });
  ctx.fillStyle = p.accent; ctx.font = `600 ${u * 2.6}px Manrope, sans-serif`;
  ctx.fillText('Danke, dass es schon unterwegs ist.', u * 8, h * 0.955);

}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function boardSize() { return boardFmt === 'phone' ? [1080, 1920] : [1240, 1754]; }

  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.ob) {
    const d = obDraft;
    if (b.dataset.ob === 'demo') { S = demo(); save(); tab = 'heute'; return render(); }
    if (b.dataset.ob === 'examples') { d.areas.forEach((k, i) => { if (!d.goals[i].trim()) d.goals[i] = AREAS[k].ex; }); return render(); }
    if (b.dataset.ob === 'back') { obStep = Math.max(0, obStep - 1); return render(); }
    if (b.dataset.ob === 'next') { if (obStep === 5) return finishOnboarding(); obStep++; return render(); }
  }
  if (b.dataset.area) {
    const a = obDraft.areas, k = b.dataset.area;
    if (a.includes(k)) a.splice(a.indexOf(k), 1); else if (a.length < 3) a.push(k); else toast('Höchstens drei Bereiche');
    return render();
  }
  if (b.dataset.tab) { tab = b.dataset.tab; render(); scrollTo(0, 0); return; }
  if (b.dataset.fmt) { boardFmt = b.dataset.fmt; return render(); }
  if (b.dataset.style) { boardStyle = b.dataset.style; return render(); }
  if (b.dataset.sound) {
    const id = b.dataset.sound, was = playing; stopSound();
    if (was !== id) playSound(id);
    return render();
  }
  const act = b.dataset.act;
  if (act === 'rec') openRecorder(b.dataset.kind);
  if (act === 'pause') { S.pauses.push(addDays(today(), -1)); S.pausesLeft--; save(); render(); toast('Deine Serie ist geschützt.'); }
  if (act === 'fulfil') {
    const g = S.goals.find(x => x.id === b.dataset.id); g.fulfilled = today(); save(); render();
    if (navigator.vibrate) navigator.vibrate([30, 40, 60]);
    showImage(shareCard('wish', g), 'Es ist eingetroffen', 'lumi-eingetroffen.png', 'Perfekt für deine Instagram- oder TikTok-Story.');
  }
  if (act === 'share-wish') { const g = S.goals.find(x => x.id === b.dataset.id); showImage(shareCard('wish', g), 'Teilen', 'lumi-eingetroffen.png', 'Perfekt für deine Instagram- oder TikTok-Story.'); }
  if (act === 'share-streak') showImage(shareCard('streak'), 'Deine Serie', 'lumi-serie.png', 'In der App öffnet sich hier direkt das Teilen-Menü für Instagram, TikTok und WhatsApp.');
  if (act === 'save-board') { const [w, h] = boardSize(); saveCanvas(drawBoard(w, h), boardFmt === 'phone' ? 'lumi-hintergrund.png' : 'lumi-vision-board-a4.png'); }
  if (act === 'buy') toast('Im Prototyp ist der Kauf noch nicht aktiv.');
  if (act === 'reset') { stopSound(); S = blank(); obStep = 0; obDraft = null; save(); render(); }
});
document.addEventListener('input', e => {
  const t = e.target, d = obDraft; if (!d) return;
  if (t.id === 'obName') { d.name = t.value; document.querySelector('[data-ob="next"]').disabled = !t.value.trim(); }
  if (t.dataset.goal) { d.goals[+t.dataset.goal] = t.value; document.querySelector('[data-ob="next"]').disabled = !d.areas.some((_, i) => d.goals[i].trim()); }
  if (t.id === 'tm') d.morning = t.value;
  if (t.id === 'te') d.evening = t.value;
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'addGoal') return; e.preventDefault();
  const v = document.getElementById('newGoal').value.trim(); if (!v) return;
  S.goals.unshift({ id: uid(), area: S.areas[0] || 'selbst', text: v, created: today(), fulfilled: null }); save(); render();
});

render();
if (document.fonts) document.fonts.ready.then(() => { if (tab === 'board') drawBoardPreview(); });
</script>
